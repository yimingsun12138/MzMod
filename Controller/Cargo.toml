[package]
name = "mzmod-controller"
version = "0.1.1"
authors = ["Yiming Sun, helped by Codex"]
repository = "https://github.com/yimingsun12138/MzMod"
license = "MIT"
edition = "2021"
publish = false

[package.metadata.mzmod]
game-series = "3.4"

[[bin]]
name = "MzModController"
path = "src/main.rs"

[dependencies]
anyhow = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value", "arbitrary_precision"] }
sha2 = "0.10"
tar = "0.4"

[build-dependencies]
embed-resource = "3"
flate2 = "1"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
tar = "0.4"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["ico"] }
rfd = { version = "=0.15.4", default-features = false }
ureq = { version = "3.5", default-features = false, features = ["rustls", "win-system-proxy"] }

[profile.release]
strip = true
